[client]
# No Deploy button or developer menu.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# Serves static/ (logo and the Archivo font), so the site also works offline.
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#14743F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EAF5EE"
textColor = "#12261A"
linkColor = "#14743F"
borderColor = "#C6DDCE"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
# Archivo from Google Fonts, served from static/fonts.
font = "Archivo, Arial, sans-serif"
headingFont = "Archivo, Arial, sans-serif"
baseFontSize = 18
paddingTop = "0rem"
paddingBottom = "0rem"
headingFontSizes = ["56px", "38px", "26px", "22px", "20px", "18px"]
headingFontWeights = [800, 800, 700, 700, 700, 700]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 800
# Categorical order checked for colour-blind separation.
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baa7a", "#4a3aa7"]
dataframeHeaderBackgroundColor = "#D8EEDF"
dataframeBorderColor = "#C6DDCE"

[theme.sidebar]
backgroundColor = "#0C3B21"
secondaryBackgroundColor = "#17573A"
textColor = "#FFFFFF"
primaryColor = "#86E0A8"
borderColor = "#17573A"

[[theme.fontFaces]]
family = "Archivo"
url = "app/static/fonts/archivo-latin.woff2"
weight = "400 800"
